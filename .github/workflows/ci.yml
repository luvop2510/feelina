name: Verify Feelina
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          # Public test-only configuration; OAuth requests are intercepted by the tests.
          VITE_SUPABASE_URL: https://feelina-browser-tests.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_browser_test_only
          VITE_SUPABASE_READY: "true"
